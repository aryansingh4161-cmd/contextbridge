[project]
name = "contextbridge"
version = "0.1.0"
description = "Local-first, provider-independent memory and context-handoff system for AI assistants (MCP)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
ctxb = "contextbridge.cli.main:main"
contextbridge-mcp = "contextbridge.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 60

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
